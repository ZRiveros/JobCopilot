name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      # The runner has Docker, so the PostgreSQL tests must run – fail instead of silently skipping.
      JOBCOPILOT_REQUIRE_DB_TESTS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  docker:
    name: Docker image and compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build image
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait until the app is healthy (migrations applied, database reachable)
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://localhost:8080/healthz; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Login page is served
        run: curl --fail --silent http://localhost:8080/login | grep -q "Lösenord"

      # Without this script every page is blank. It once went missing from the image only,
      # because the image restores packages before the .razor files are copied in.
      - name: Blazor script is in the image
        run: curl --fail --silent --output /dev/null http://localhost:8080/_framework/blazor.web.js

      - name: Everything else is behind the login
        run: test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/ads)" = "401"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
